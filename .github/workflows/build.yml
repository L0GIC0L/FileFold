name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 build-tools;37.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      # The release build is the one to install: it is optimised and runs much faster than a
      # debug build. It is signed with the repository's development key, so each new build
      # installs over the last.
      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: FileFold-apk
          path: app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
